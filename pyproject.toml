[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atom-jepa-accel"
dynamic = ["version"]
description = "Drop-in CPU acceleration for Atom-JEPA (EquiformerV3), activated by a single import."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Eachan Johnson" }]
keywords = ["pytorch", "cheminformatics", "performance", "molecular representation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=8", "atom-jepa>=0.4", "rdkit", "safetensors"]
docs = [
  "sphinx>=7.3",
  "pydata-sphinx-theme>=0.15",
  "myst-parser>=3",
  "sphinx-copybutton",
  "sphinx-design",
]
dev = ["atom-jepa-accel[test,docs]", "ruff", "build"]

[project.scripts]
atom-jepa-accel-bench = "atom_jepa_accel.bench.__main__:main"
atom-jepa-accel-report = "atom_jepa_accel.bench.report:main"

[project.urls]
Homepage = "https://github.com/scbirlab/atom-jepa-accel"
Documentation = "https://scbirlab.github.io/atom-jepa-accel/"
Issues = "https://github.com/scbirlab/atom-jepa-accel/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "atom_jepa_accel.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B905", "E402", "E741", "E731", "B028", "UP035", "UP006", "UP007", "UP045", "I001"]
